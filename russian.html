<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>RUSSIAN</title>
</head>

<body>

    <div id="container" class="position-relative bg-secondary">

        <div id="winscreen" class="z-2 position-absolute top-30 start-50 translate-middle bg-primary w-5 h-max">
            <p id="winner">EL GANADOR ES: winner</p>
        </div>

        <div id="emptyscreen" class="z-2 position-absolute top-10 start-50 translate-middle bg-primary w-5 h-max">
            <p>VACIO... </p>
        </div>

        <section class="d-flex justify-content-around align-items-center">

            <div class="d-flex flex-column">
                <div>
                    <img src="img/player.jpg" alt="">
                    <h2>PLAYER 1</h2>
                    <p id="p1puntos">0</p>
                    <p>puntos</p>
                </div>
            </div>

            <div>
                <button id="botonJugar" class="z-2 ">JUGAR</button>
                <button id="botondisparar">DISPARARLE</button>
                <button id="botondispararme">DISPARARME</button>
            </div>

            <div class="d-flex flex-column">
                <div>
                    <img src="img/enemy.jpg" alt="">
                    <h2>PLAYER 2</h2>
                    <p id="p2puntos">0</p>
                    <p>puntos</p>
                </div>
            </div>

        </section>

        <div id="turnos"
            class="d-flex flex-column z-2 position-absolute bottom-0 start-50 translate-middle align-items-center">
            <h2>TURNO DE:</h2>

            <div class="d-flex justify-content-around align-items-center">

                <div class="d-flex flex-column align-items-center p-1">
                    <img id="luzroja1" class="mh-100" style="width: 100px; height: 100px;" src="img/luzroja.png" alt="">
                    <img id="luzverde1" class="mh-100" style="width: 100px; height: 100px;" src="img/luzverde.png"
                        alt="">
                    <p>Player 1</p>
                </div>

                <div class="d-flex flex-column align-items-center p-1">
                    <img id="luzroja2" class="mh-100" style="width: 100px; height: 100px;" src="img/luzroja.png" alt="">
                    <img id="luzverde2" class="mh-100" style="width: 100px; height: 100px;" src="img/luzverde.png"
                        alt="">
                    <p>Player 2</p>
                </div>

            </div>

        </div>

        <script src="russian.js"></script>
</body>

</html>
